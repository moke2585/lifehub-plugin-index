name: Sign registry

on:
  push:
    branches: [main]
    paths: ["registry.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    environment: index-signing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Check index signing secrets
        env:
          KEY_A: ${{ secrets.INDEX_EC_P256_PRIVATE_KEY_B64 }}
          KEY_B: ${{ secrets.INDEX_SIGNING_KEY_B64 }}
          KEY_C: ${{ secrets.INDEX_PRIVATE_KEY_B64 }}
          KEY_ID: ${{ vars.INDEX_KEY_ID || secrets.INDEX_KEY_ID || 'index-2026-11' }}
        run: |
          for entry in \
            "INDEX_EC_P256_PRIVATE_KEY_B64=$KEY_A" \
            "INDEX_SIGNING_KEY_B64=$KEY_B" \
            "INDEX_PRIVATE_KEY_B64=$KEY_C" \
            "INDEX_KEY_ID=$KEY_ID"; do
            name=${entry%%=*}
            value=${entry#*=}
            if [ -n "$value" ]; then
              echo "$name: present"
            else
              echo "$name: missing"
            fi
          done
          KEY_VALUE="${KEY_A:-${KEY_B:-$KEY_C}}"
          if [ -n "$KEY_VALUE" ]; then
            echo "selected key length=${#KEY_VALUE}"
            echo "selected key prefix=$(printf '%s' "$KEY_VALUE" | cut -c1-12)"
          fi

      - name: Sign registry
        env:
          INDEX_PRIVATE_KEY_B64: ${{ secrets.INDEX_EC_P256_PRIVATE_KEY_B64 || secrets.INDEX_SIGNING_KEY_B64 || secrets.INDEX_PRIVATE_KEY_B64 }}
          INDEX_KEY_ID: ${{ vars.INDEX_KEY_ID || secrets.INDEX_KEY_ID || 'index-2026-11' }}
        run: |
          if [ -z "$INDEX_PRIVATE_KEY_B64" ]; then
            echo "缺少索引签名私钥：请在 lifehub-plugin-index 的 Environment index-signing（或仓库 Secrets）添加 INDEX_EC_P256_PRIVATE_KEY_B64" >&2
            exit 1
          fi
          if [ -z "$INDEX_KEY_ID" ]; then
            echo "缺少 INDEX_KEY_ID：请添加变量或 Secret index-2026-11" >&2
            exit 1
          fi
          if [ ! -f "keys/$INDEX_KEY_ID.pem" ]; then
            echo "公钥不存在：keys/$INDEX_KEY_ID.pem" >&2
            exit 1
          fi
          KEY_VALUE="$INDEX_PRIVATE_KEY_B64"
          if printf '%s' "$KEY_VALUE" | grep -q -- '-----BEGIN'; then
            printf '%s\n' "$KEY_VALUE" > "$RUNNER_TEMP/index-private.pem"
          else
            printf '%s' "$KEY_VALUE" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/index-private.pem" 2>"$RUNNER_TEMP/base64.err" || {
              echo "索引私钥不是合法 Base64。请填入 D:\\keys\\lifehub-index-signing.pem 的单行 Base64 输出，或直接粘贴 PEM 私钥。" >&2
              cat "$RUNNER_TEMP/base64.err" >&2
              exit 1
            }
          fi
          test -s "$RUNNER_TEMP/index-private.pem"
          java scripts/IndexSignatureTool.java sign \
            --registry registry.json \
            --key "$RUNNER_TEMP/index-private.pem" \
            --key-id "$INDEX_KEY_ID" \
            --out registry.sig
          java scripts/IndexSignatureTool.java verify \
            --registry registry.json \
            --signature registry.sig \
            --public "keys/$INDEX_KEY_ID.pem"

      - name: Commit signature
        run: |
          git add registry.sig
          if git diff --cached --quiet -- registry.sig; then
            echo "索引签名已是最新"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sign registry [skip ci]"
          git push
